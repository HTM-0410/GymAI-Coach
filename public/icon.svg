<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Tile Gradient -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="40%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Golden Orange Metallic Gradient -->
    <linearGradient id="iconGoldOrange" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Core Star Gradient -->
    <linearGradient id="iconStarGrad" x1="35" y1="35" x2="55" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Radiant Glow -->
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b1"/>
      <feGaussianBlur stdDeviation="3.5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Frosted Glass Tile -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#iconBg)"/>
  <rect x="4.5" y="4.5" width="91" height="91" rx="23.5" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- ═══ THE CYBER CREST EMBLEM ═══ -->
  <g filter="url(#iconGlow)">
    <!-- Outer Ribbon Arc -->
    <path d="
      M 68,24
      L 61.5,28.5
      C 58,24 53,21 47,21
      C 33.7,21 23,31.7 23,45
      C 23,58.3 33.7,69 47,69
      C 53.5,69 59.2,66.2 63.5,61.5
      L 63.5,66
      C 59,70.5 53.2,73.5 47,73.5
      C 31.2,73.5 18.5,60.8 18.5,45
      C 18.5,29.2 31.2,16.5 47,16.5
      C 55.2,16.5 62.5,20 68,24
      Z
    " fill="url(#iconGoldOrange)"/>

    <!-- Inner Accent Line (Concentric Ring Detail) -->
    <path d="
      M 56,29
      C 53.5,26.8 50.4,25.5 47,25.5
      C 36.2,25.5 27.5,34.2 27.5,45
      C 27.5,55.8 36.2,64.5 47,64.5
      C 50.4,64.5 53.5,63.2 56,61
    " stroke="url(#iconGoldOrange)" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>

    <!-- Center Barbell Shaft -->
    <path d="M 45,43.5 L 67,43.5 L 67,46.5 L 45,46.5 Z" fill="url(#iconGoldOrange)"/>

    <!-- AI 4-Point Primary Star Nucleus -->
    <path d="
      M 45,34
      C 45,40.5 39.5,45 33,45
      C 39.5,45 45,49.5 45,56
      C 45,49.5 50.5,45 57,45
      C 50.5,45 45,40.5 45,34
      Z
    " fill="url(#iconStarGrad)"/>

    <!-- Secondary Diagonal Spark Points -->
    <path d="M 37.5,37.5 L 40,40 M 52.5,37.5 L 50,40 M 37.5,52.5 L 40,50 M 52.5,52.5 L 50,50"
      stroke="url(#iconStarGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Micro Orbital AI Data Particles -->
    <circle cx="45" cy="30" r="1.5" fill="#ffffff"/>
    <circle cx="45" cy="60" r="1.5" fill="#ffffff"/>
    <circle cx="30" cy="45" r="1.5" fill="#ffffff"/>
    <circle cx="60" cy="45" r="1.5" fill="#ffffff"/>

    <!-- Triple Barbell Weight Plates Stack -->
    <rect x="67" y="33" width="3.5" height="24" rx="1.75" fill="url(#iconGoldOrange)"/>
    <rect x="72" y="36.5" width="2.8" height="17" rx="1.4" fill="url(#iconGoldOrange)"/>
    <rect x="76.3" y="40" width="2.2" height="10" rx="1.1" fill="url(#iconGoldOrange)"/>
    <rect x="79.5" y="43.5" width="2.2" height="3" rx="0.8" fill="url(#iconGoldOrange)"/>
  </g>
</svg>
